[project]
name = "nmah-military-collection-mcp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastmcp==4.1.1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13,<3",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py", "playground/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
